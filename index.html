on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: \${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: \${{ secrets.AZURE_TENANT_ID }}
          subscription-id: \${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-web
          template: ./infra/main.bicep
          deploymentMode: Incremental`,
     why:`<code>id-token: write</code> lets the job request a GitHub OIDC token, which <code>azure/login</code> exchanges for an Entra ID token through the federated credential, so no secret is stored. The <code>production</code> environment adds required reviewers and changes the token's subject to <code>…:environment:production</code>, which the federated credential must match.`},
    {id:"pl3", type:"mc", title:"deploymentMode: Validation",
     q:`In <code>AzureResourceManagerTemplateDeployment@3</code>, what does <code>deploymentMode: Validation</code> do?`,
     options:[
       "Deploys in incremental mode and then runs smoke tests",
       "Validates the template and reports errors without deploying any resources",
       "Deletes resources that aren't in the template, after asking for approval",
       "Runs ARM TTK against the template"
     ], answer:1,
     hint:`It's the pipeline equivalent of a preflight check.`,
     why:`Validation mode only validates the template; nothing is deployed. It's handy as a pull request check. Incremental and Complete are the two real deployment modes; ARM TTK is a separate PowerShell module.`},
    {id:"pl4", type:"multi", title:"Secure the IaC pipeline",
     q:`Which measures improve the security of a pipeline that deploys infrastructure to production? <i>Select all that apply.</i>`,
     options:[
       "Use workload identity federation (OIDC) instead of a client secret",
       "Grant the pipeline identity Contributor only on the resource groups it deploys to",
       "Store the service principal secret in the YAML file so it's versioned",
       "Require an approval on the production environment, with the what-if output available to the approver",
       "Give the pipeline identity Owner on the tenant root management group to avoid permission errors",
       "Protect main with branch policies so only reviewed changes trigger production deployments"
     ], answer:[0,1,3,5],
     hint:`No long-lived secrets, least privilege, human gate, protected source.`,
     why:`Federated credentials remove secrets entirely; least-privilege scope limits the damage if the pipeline is abused; environment approvals put a human in front of production; and branch protection ensures only reviewed code is deployed. Secrets in YAML and tenant-wide Owner do the opposite.`},
    {id:"pl5", type:"lines", title:"Fix the workflow",
     q:`Requirements: log in with OIDC, and <b>never delete</b> resources that aren't in the template. Click the <b>two</b> lines that break these requirements.`,
     code:[
       "permissions:",
       "  id-token: read",
       "  contents: read",
       "jobs:",
       "  deploy:",
       "    runs-on: ubuntu-latest",
       "    environment: production",
       "    steps:",
       "      - uses: actions/checkout@v4",
       "      - uses: azure/login@v2",
       "        with:",
       "          client-id: ${{ secrets.AZURE_CLIENT_ID }}",
       "          tenant-id: ${{ secrets.AZURE_TENANT_ID }}",
       "          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}",
       "      - uses: azure/arm-deploy@v2",
       "        with:",
       "          resourceGroupName: rg-web",
       "          template: ./infra/main.bicep",
       "          deploymentMode: Complete"
     ], answer:[1,18],
     hint:`One permission is too weak to request a token; one setting deletes things.`,
     why:`Requesting an OIDC token needs <code>id-token: write</code>; with <code>read</code> (or no setting), azure/login can't get a token. <code>deploymentMode: Complete</code> deletes every resource in <code>rg-web</code> that the template doesn't define. Use <code>Incremental</code> (the default), and a deployment stack if you want controlled deletes.`}
  ]
},

  intro:`<b>Azure Automation State Configuration</b> is a managed <b>DSC pull server</b>: you upload PowerShell DSC configurations, Azure compiles them, machines pull their configuration and report compliance. It is still in the exam objectives, but Microsoft has announced that it <b>retires on 30 September 2027</b> and recommends moving to <b>Azure Machine Configuration</b> (next module).`,

            Name   = 'Web-Server'
        }
        Service W3SVC {
            Name        = 'W3SVC'
            State       = 'Running'
            StartupType = 'Automatic'

        }
    }
}`, after:`<p>A <b>configuration</b> is the PowerShell script. <b>Compiling</b> it produces a <b>node configuration</b> (a MOF document) per node block, named <code>ConfigurationName.NodeName</code>, here <code>WebServer.localhost</code>. On each machine the <b>Local Configuration Manager (LCM)</b> applies it.</p>`},
    {h:"The workflow in Azure Automation", lang:"text", code:`1 Import the configuration      Import-AzAutomationDscConfiguration -SourcePath .\\WebServer.ps1 -Published …
2 Compile it                    Start-AzAutomationDscCompilationJob -ConfigurationName WebServer …
3 Onboard (register) nodes      Azure VMs (DSC extension), on-premises / other clouds (DSC metaconfiguration),
                                e.g. Register-AzAutomationDscNode …
4 Assign a node configuration   e.g. WebServer.localhost
5 The LCM pulls and applies it  at its refresh / configuration-mode interval
6 Review compliance             per node: Compliant, Not compliant, Failed, … (and send reports to Log Analytics)`},

<tr><th>ConfigurationMode</th><th>Behaviour</th></tr>

{
  group:"Desired state configuration",
  title:"Azure Machine Configuration",
  tag:"Azure Policy · guest assignments · Arc · audit & apply",
  intro:`<b>Azure Machine Configuration</b> (formerly <i>Azure Policy Guest Configuration</i>, for a while branded <i>Azure Automanage Machine Configuration</i>) is the Azure Policy feature that <b>audits and applies settings inside machines</b>: Azure VMs and Azure Arc-enabled servers, Windows and Linux.`,
  sections:[
    {h:"How it works", lang:"text", code:`Azure Policy definition (machine configuration)
   │  AuditIfNotExists  → report only
   │  DeployIfNotExists → create a guest configuration assignment (apply)
   ▼
guestConfigurationAssignment on the machine  (Microsoft.GuestConfiguration/guestConfigurationAssignments)
   ▼
machine configuration agent inside the OS
   Azure VM:   machine configuration extension + system-assigned managed identity
   Arc server: built into the Azure Connected Machine agent
   ▼
compliance results → Azure Policy compliance (and Azure Resource Graph)`},
    {h:"Assignment types", after:`<div class="tablewrap"><table class="ref">
<tr><th>Type</th><th>Behaviour</th></tr>
<tr><td><b>Audit</b></td><td>Only report on the state of the machine</td></tr>
<tr><td><b>ApplyAndMonitor</b></td><td>Apply the configuration, then monitor and report drift</td></tr>
<tr><td><b>ApplyAndAutoCorrect</b></td><td>Apply the configuration and bring the machine back into conformance when drift occurs</td></tr>
</table></div>
<p>Microsoft provides the built-in initiative <i>Deploy prerequisites to enable Guest Configuration policies on virtual machines</i>, which adds the system-assigned identity and the extension. Like every <code>DeployIfNotExists</code> policy, existing non-compliant machines need a <b>remediation task</b>.</p>`},
    {h:"Custom configurations", lang:"text", code:`1 Write a DSC configuration and compile it to a MOF
2 New-GuestConfigurationPackage    → .zip package (Type Audit or AuditAndSet)   [GuestConfiguration module]
3 Test it locally                  Get-GuestConfigurationPackageComplianceStatus / Start-GuestConfigurationPackageRemediation
4 Upload the .zip to storage        (e.g. a blob the machines can reach)
5 New-GuestConfigurationPolicy     → policy definition JSON (with the content URI and hash)
6 Create + assign the policy        New-AzPolicyDefinition / New-AzPolicyAssignment, remediation task for existing machines`}
  ],
  tip:`"Audit or enforce settings <b>inside</b> VMs (Azure, on-premises, other clouds) and see compliance in Azure Policy" → <b>Machine Configuration</b> (+ <b>Azure Arc</b> for non-Azure machines). Azure VM prerequisites: <b>extension + system-assigned managed identity</b>. Existing machines and DeployIfNotExists → <b>remediation task</b>.`,
  exercises:[
    {id:"mcf1", type:"multi", title:"Prerequisites on an Azure VM",
     q:`You assign a built-in Machine Configuration policy to a subscription. What does each <b>Azure VM</b> need for it to report compliance? <i>Select all that apply.</i>`,
     options:[
       "The machine configuration (Guest Configuration) extension",

       "A DSC pull server URL in its LCM settings",
       "A public IP address"
     ], answer:[0,1],
     hint:`Microsoft has a built-in initiative that deploys exactly these prerequisites.`,
     why:`The extension runs the agent inside the VM, and the system-assigned managed identity lets it talk to the service. Automation accounts and pull servers belong to the older Automation State Configuration. On Azure Arc-enabled servers, the agent is part of the Connected Machine agent.`},
    {id:"mcf2", type:"match", title:"Choose the assignment type",
     q:`Match each requirement to the Machine Configuration assignment type.`,
     choices:["Audit","ApplyAndMonitor","ApplyAndAutoCorrect"],
     rows:[
       ["Security wants a report of servers where TLS 1.0 is enabled, without changing anything","Audit"],
       ["Apply the time zone setting, and if someone changes it later, set it back automatically","ApplyAndAutoCorrect"],
       ["Apply the baseline once, then report drift but let operators decide how to fix it","ApplyAndMonitor"]
     ],
     hint:`Report only · apply + report · apply + fix.`,
     why:`Audit only reports; ApplyAndMonitor applies once and then reports drift; ApplyAndAutoCorrect applies and corrects drift. Audit uses AuditIfNotExists policies; the apply types are deployed through DeployIfNotExists policies.`},
    {id:"mcf3", type:"order", title:"Ship a custom configuration",

       "Upload the package .zip to a storage location the machines can reach",

     ],

     why:`The GuestConfiguration PowerShell module turns a compiled DSC configuration into a package, lets you test it locally, and generates a policy definition that points to the uploaded package (with its hash). Assigning the policy creates guest assignments; a remediation task covers machines that existed before the assignment.`},

     q:`You assigned a DeployIfNotExists Machine Configuration policy (ApplyAndAutoCorrect). New VMs get the setting, but the 120 VMs that already existed show as non-compliant and nothing is applied to them. What do you do?`,
     options:[

       "Create a remediation task for the policy assignment",
       "Change the assignment type to Audit",
       "Restart the Azure Policy service"
     ], answer:1,

     why:`DeployIfNotExists policies act automatically on resources that are created or updated. For existing resources, you start a <b>remediation task</b> (the assignment's managed identity then deploys the guest assignment). Switching to Audit would only report the problem.`}

{

  title:"Azure Deployment Environments",

  intro:`<b>Azure Deployment Environments</b> (ADE) lets developers spin up approved infrastructure on demand, from templates the platform team curates, without needing access to the subscriptions themselves.`,
  sections:[
    {h:"Key concepts", after:`<div class="tablewrap"><table class="ref">
<tr><th>Concept</th><th>What it is</th></tr>
<tr><td><b>Dev center</b></td><td>Top-level resource: a collection of projects that need similar settings. Holds catalogs and environment types (shared with Microsoft Dev Box).</td></tr>
<tr><td><b>Catalog</b></td><td>A GitHub or Azure DevOps Services (Azure Repos) repository with environment definitions</td></tr>
<tr><td><b>Environment definition</b></td><td>An IaC template plus an <code>environment.yaml</code> manifest. ARM and Bicep run natively; Terraform, Pulumi and others through custom container images.</td></tr>
<tr><td><b>Environment type</b></td><td>A category such as Dev, Test, Sandbox or Prod, defined on the dev center</td></tr>

/* ===================================================================
   MINI YAML PARSER (same as the Pipelines lab)
   Turns YAML into a flat list of { path, value } entries, e.g.
     body[0].type = textarea
   =================================================================== */
const toStr = t => t.reduce((s, x) => x[0] === "[" ? s + x : (s ? s + "." + x : x), "");

function cleanVal(v){
  v = (v || "").trim();
  if (v[0] === "'"){ const m = v.match(/^'((?:[^']|'')*)'/); if (m) return m[1].replace(/''/g, "'"); }
  if (v[0] === '"'){ const m = v.match(/^"((?:[^"\\]|\\.)*)"/); if (m) return m[1]; }
  const ci = v.search(/(^|\s)#/);
  return (ci >= 0 ? v.slice(0, ci) : v).trim();
}

function splitFlow(inner){
  const out = []; let cur = "", depth = 0, q = null;
  for (const ch of inner){
    if (q){ cur += ch; if (ch === q) q = null; continue; }
    if (ch === "'" || ch === '"'){ q = ch; cur += ch; continue; }
    if ("[{(".includes(ch)) depth++;
    if ("]})".includes(ch)) depth--;
    if (ch === "," && depth === 0){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}

function parseYaml(text){
  const lines = text.replace(/\r/g, "").split("\n");
  const entries = [], errors = [];
  const root = {col:-1, gt:[], it:[], kids:null};
  const stack = [root], counters = new Map();
  const top = () => stack[stack.length - 1];
  const add = (gt, it, value, line) => entries.push({gt, it, gen:toStr(gt), idx:toStr(it), value, line});
  let flagged = -1;
  const sibling = (parent, col, ln, kind) => {
    if (parent.kind && parent.kind !== kind && flagged !== ln){
      flagged = ln;
      errors.push(`Line ${ln}: this ${kind === "list" ? "list item" : "key"} sits at the same level as ${kind === "list" ? "keys" : "\"- \" list items"} under the same parent. Check the indentation.`);
    }
    parent.kind = parent.kind || kind;
    if (parent.kids === null) parent.kids = col;
    else if (parent.kids !== col && flagged !== ln)
      errors.push(`Line ${ln}: indented ${col} spaces, but its siblings use ${parent.kids}. Items at the same level must line up exactly.`);
  };
  let lastScalar = null;

  for (let i = 0; i < lines.length; i++){
    const raw = lines[i], ln = i + 1;
    if (!raw.trim() || /^\s*#/.test(raw)) continue;
    if (/^ *\t/.test(raw)){ errors.push(`Line ${ln}: a tab is used for indentation. YAML only allows spaces.`); continue; }
    const lineCol = raw.match(/^ */)[0].length;
    let col = lineCol, rest = raw.slice(col).replace(/\s+$/, "");
    if (lastScalar && col > lastScalar.col && (flagged = ln))
      errors.push(`Line ${ln}: indented under "${lastScalar.key}" (line ${lastScalar.ln}), but that key already has a value on its own line.`);
    lastScalar = null;

    let dashNode = null;
    while (/^-(\s|$)/.test(rest)){
      while (stack.length > 1 && (top().col > col || (top().dash && top().col === col))) stack.pop();
      const parent = top();
      sibling(parent, col, ln, "list");
      const n = counters.get(parent) ?? 0; counters.set(parent, n + 1);
      dashNode = {col, gt:[...parent.gt, "[]"], it:[...parent.it, `[${n}]`], kids:null, dash:true};
      stack.push(dashNode);
      const m = rest.match(/^-\s*/)[0].length;
      col += m; rest = rest.slice(m);
    }
    if (!rest) continue;

    const km = /^['"]/.test(rest) ? null : rest.match(/^(.+?)\s*:(?:\s+(.*))?$/);
    if (!km){
      if (dashNode) add(dashNode.gt, dashNode.it, cleanVal(rest), ln);
      else errors.push(`Line ${ln}: "${rest.slice(0, 40)}" is not a "key: value" pair or a "- item". Check for a missing colon or a missing space after it.`);
      continue;
    }

    const key = cleanVal(km[1]) || km[1];
    while (stack.length > 1 && top().col >= col) stack.pop();
    const parent = top();
    sibling(parent, col, ln, "map");
    const gt = [...parent.gt, key], it = [...parent.it, key];
    const rawVal = (km[2] || "").trim();

    if (/^[|>][-+]?\d*\s*(#.*)?$/.test(rawVal)){
      const body = []; let j = i + 1;
      for (; j < lines.length; j++){
        const l = lines[j];
        if (!l.trim()){ body.push(""); continue; }
        if (l.match(/^ */)[0].length > lineCol) body.push(l); else break;
      }
      while (body.length && !body[body.length - 1].trim()) body.pop();
      const ind = body.filter(x => x.trim()).map(x => x.match(/^ */)[0].length);
      const min = ind.length ? Math.min(...ind) : 0;
      if (!body.length) errors.push(`Line ${ln}: "${key}: ${rawVal}" starts a multi-line block, but no indented lines follow.`);
      add(gt, it, body.map(x => x.slice(min)).join("\n"), ln);
      i = j - 1;
      continue;
    }

    const quoted = /^['"]/.test(rawVal);
    const v = cleanVal(rawVal);
    if (v === "" && !quoted){
      stack.push({col, gt, it, kids:null});
      add(gt, it, "", ln);
    } else if (!quoted && /^\[.*\]$/.test(v)){
      add(gt, it, "", ln);
      splitFlow(v.slice(1, -1)).forEach((x, k) => add([...gt, "[]"], [...it, `[${k}]`], cleanVal(x), ln));
      lastScalar = {col, key, ln};
    } else if (!quoted && /^\{.*\}$/.test(v)){
      add(gt, it, "", ln);
      splitFlow(v.slice(1, -1)).forEach(pair => {
        const pm = pair.match(/^(.+?)\s*:\s*(.*)$/);
        if (pm) add([...gt, cleanVal(pm[1])], [...it, cleanVal(pm[1])], cleanVal(pm[2]), ln);
      });
      lastScalar = {col, key, ln};
    } else {
      add(gt, it, v, ln);
      lastScalar = {col, key, ln};
    }
  }
  return {entries, errors};
}

function globRe(p){
  if (p instanceof RegExp) return p;
  return new RegExp("^" + p.split(/(\*\*|\*|\[\]\?)/).map(s =>
    s === "**" ? ".*" :
    s === "*" ? "[^.\\[\\]]*" :
    s === "[]?" ? "(\\[\\])?" :
    s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("") + "$", "i");
}
const valMatch = (v, w) => w === undefined ? true : w instanceof RegExp ? w.test(v) : String(v).toLowerCase() === String(w).toLowerCase();

function makeApi(entries, src){
  const find = (p, w) => { const re = globRe(p); return entries.filter(e => re.test(e.gen) && valMatch(e.value, w)); };
  return {
    src,
    h: (p, w) => find(p, w).length > 0,
    count: (p, w) => find(p, w).length,
    first: (p, w) => Math.min(Infinity, ...find(p, w).map(e => e.line)),
    item(listPath, conds){
      const re = globRe(listPath + "[]"), groups = new Map();
      for (const e of entries){
        for (let n = 1; n <= e.gt.length; n++){
          if (e.gt[n - 1] !== "[]" || !re.test(toStr(e.gt.slice(0, n)))) continue;
          const k = toStr(e.it.slice(0, n));
          if (!groups.has(k)) groups.set(k, []);
          groups.get(k).push({rel:toStr(e.gt.slice(n)), value:e.value});
        }
      }
      return [...groups.values()].some(list =>
        Object.entries(conds).every(([rp, w]) => { const r = globRe(rp); return list.some(x => r.test(x.rel) && valMatch(x.value, w)); }));
    }
  };
}

/* Tokenizes shell / PowerShell commands into {words, flags}. Line continuations (\ or `) are joined.
   run(prefix, {"--flag|-f": regex|string|null(present)|false(absent)}) → true if one command matches. */
function parseCli(src){
  const text = String(src).replace(/\r/g, "").replace(/[ \t]+(\\|`)[ \t]*\n/g, " ");
  const cmds = [];
  for (const raw of text.split("\n")){
    const toks = [], re = /"([^"]*)"|'([^']*)'|(\S+)/g; let m;
    while ((m = re.exec(raw))){
      if (m[3] !== undefined && m[3].startsWith("#")) break;
      toks.push(m[3] !== undefined ? {t:m[3], q:false} : {t:m[1] !== undefined ? m[1] : m[2], q:true});
    }
    if (!toks.length) continue;
    const words = [], flags = {}; let cur = null;
    for (const {t, q} of toks){
      if (!q && /^--?[A-Za-z]/.test(t)){
        let name = t, val;
        const eq = t.indexOf("=");
        if (t.startsWith("--") && eq > 0){ name = t.slice(0, eq); val = t.slice(eq + 1); }
        name = name.toLowerCase();
        cur = flags[name] = flags[name] || [];
        if (val !== undefined) cur.push(val);
      } else if (cur) cur.push(t);
      else words.push(t.toLowerCase());
    }
    cmds.push({words:words.join(" "), flags});
  }
  return cmds;
}
function cliApi(src){
  const cmds = parseCli(src);
  const run = (prefix, conds = {}) => cmds.some(c =>
    (c.words + " ").startsWith(prefix.toLowerCase() + " ") &&
    Object.entries(conds).every(([names, w]) => {
      const ns = names.split("|").map(n => n.toLowerCase());
      const present = ns.some(n => c.flags[n]);
      if (w === false) return !present;
      if (w === null || w === true) return present;
      return present && ns.flatMap(n => c.flags[n] || []).some(v => valMatch(v, w));
    }));
  return {cmds, run};
}

/* ===================================================================
   CHECKING (pure functions, no DOM: also used by the self-test)
   =================================================================== */
const norm = s => String(s).trim().replace(/\s+/g, " ").toLowerCase();
const sameSet = (a, b) => a.length === b.length && [...a].sort().join() === [...b].sort().join();

// Returns {ok, results:[{l, ok, sub?}], marks}  (marks drive per-item coloring)
function grade(ex, ans){
  switch (ex.type){
    case "mc": {
      const ok = ans === ex.answer;
      return {ok, results:[{l: ans === null || ans === undefined ? "Pick an answer first." : ok ? "Correct!" : "Not quite. Read the hint and try again.", ok}]};
    }
    case "multi": {
      const sel = ans || [];
      const missing = ex.answer.filter(i => !sel.includes(i)).length;
      const extra = sel.filter(i => !ex.answer.includes(i)).length;
      const ok = missing === 0 && extra === 0;
      const r = [];
      if (ok) r.push({l:"Correct! You found exactly the right options.", ok:true});
      else {
        r.push({l: missing ? `${missing} correct option${missing > 1 ? "s" : ""} not selected` : "All correct options selected", ok: !missing});
        r.push({l: extra ? `${extra} selected option${extra > 1 ? "s are" : " is"} wrong` : "No wrong options selected", ok: !extra});
      }
      return {ok, results:r};
    }
    case "order": {
      const seq = ans || [];
      const marks = seq.map((it, pos) => it === pos);
      const right = marks.filter(Boolean).length;
      const ok = right === ex.items.length;
      return {ok, marks, results:[{l: ok ? "Correct order!" : `${right}/${ex.items.length} items are in the right position.`, ok}]};
    }
    case "match": {
      const sel = ans || [];
      const marks = ex.rows.map((r, i) => sel[i] === r[1]);
      const right = marks.filter(Boolean).length;
      const ok = right === ex.rows.length;
      return {ok, marks, results:[{l: ok ? "All matches correct!" : `${right}/${ex.rows.length} matches correct.`, ok}]};
    }
    case "fill": {
      const vals = ans || [];
      const marks = ex.blanks.map((acc, i) => acc.some(a => norm(a) === norm(vals[i] || "")));
      const right = marks.filter(Boolean).length;
      const ok = right === ex.blanks.length;
      return {ok, marks, results:[{l: ok ? "All blanks correct!" : `${right}/${ex.blanks.length} blanks correct.`, ok}]};
    }
    case "lines": {
      const sel = ans || [];
      const missing = ex.answer.filter(i => !sel.includes(i)).length;
      const extra = sel.filter(i => !ex.answer.includes(i)).length;
      const ok = missing === 0 && extra === 0;
      const r = ok ? [{l:"Correct! You spotted exactly the right lines.", ok:true}] : [
        {l: missing ? `${missing} line${missing > 1 ? "s" : ""} still to find` : "You found every faulty line", ok: !missing},
        {l: extra ? `${extra} selected line${extra > 1 ? "s are" : " is"} actually fine` : "No correct lines selected by mistake", ok: !extra}];
      return {ok, results:r};
    }
    case "text": {
      const text = String(ans || "").replace(/\r/g, "");
      const results = [];
      let api;
      if (ex.lang === "yaml"){
        const p = parseYaml(text);
        results.push({l:"Valid YAML structure: spaces only, aligned siblings, key: value pairs", ok: p.errors.length === 0 && p.entries.length > 0, sub:p.errors});
        api = makeApi(p.entries, text.replace(/^\s*#.*$/gm, ""));
      } else if (ex.lang === "json"){
        let json = null, err = "";
        try { json = JSON.parse(text); } catch (e) { err = e.message; }
        const okJson = json !== null && typeof json === "object";
        results.push({l:"Valid JSON", ok: okJson, sub: err ? [err] : []});
        api = {src:text, json: okJson ? json : null, lines:text.split("\n")};
      } else {
        const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#") && !l.startsWith("//"));
        api = {src:text, lines, ...cliApi(text)};
      }
      for (const c of ex.checks){
        let ok = false;
        try { ok = !!c.t(api); } catch (e) { ok = false; }
        results.push({l:c.l, ok});
      }
      return {ok: results.every(r => r.ok), results};
    }
  }
  return {ok:false, results:[]};
}

// The model answer for each exercise, in the same shape grade() expects.
function modelAnswer(ex){
  switch (ex.type){
    case "mc": return ex.answer;
    case "multi": case "lines": return ex.answer.slice();
    case "order": return ex.items.map((_, i) => i);
    case "match": return ex.rows.map(r => r[1]);
    case "fill": return ex.blanks.map(b => b[0]);
    case "text": return ex.solution;
  }
}

// Deterministic shuffle so the starting order is stable between visits.
function scramble(id, n){
  let seed = 0; for (const ch of id) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === i)) a.reverse();
  return a;
}

const ALL_EX = MODULES.flatMap(m => m.exercises);

/* ===================================================================
   HIGHLIGHTER (tiny, dependency-free)
   =================================================================== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function commentAt(v){
  let q = null;
  for (let i = 0; i < v.length; i++){
    const ch = v[i];
    if (q){ if (ch === q) q = null; continue; }
    if ((ch === "'" || ch === '"') && (i === 0 || /\s/.test(v[i - 1]))){ q = ch; continue; }
    if (ch === "#" && (i === 0 || /\s/.test(v[i - 1]))) return i;
  }
  return -1;
}
function hlValue(v){
  const ci = commentAt(v);
  const body = ci >= 0 ? v.slice(0, ci) : v, comment = ci >= 0 ? v.slice(ci) : "";
  const t = body.trim();
  let out;
  if (/^(['"]).*\1$/.test(t)) out = `<span class="ts">${esc(body)}</span>`;
  else if (/^[|>][-+]?\d*$/.test(t)) out = `<span class="tk">${esc(body)}</span>`;
  else if (/^(true|false|none|null|~|-?\d+(\.\d+)?)$/i.test(t)) out = `<span class="tn">${esc(body)}</span>`;
  else out = esc(body);
  return out + (comment ? `<span class="tc">${esc(comment)}</span>` : "");
}
function hlYaml(code){
  let blockCol = -1;
  return code.split("\n").map(line => {
    const ind = line.match(/^ */)[0].length;
    if (blockCol >= 0){
      if (!line.trim() || ind > blockCol) return esc(line);
      blockCol = -1;
    }
    const [, sp, dash, rest] = line.match(/^(\s*)((?:-\s+|-$)*)(.*)$/);
    if (rest.startsWith("#")) return esc(sp + dash) + `<span class="tc">${esc(rest)}</span>`;
    let out = esc(sp) + (dash ? `<span class="tdash">${esc(dash)}</span>` : "");
    const km = /^['"]/.test(rest) ? null : rest.match(/^(.+?)(\s*:)(\s+.*)?$/);
    if (km){
      out += `<span class="tk">${esc(km[1])}</span>${esc(km[2])}`;
      if (km[3]){
        const lead = km[3].match(/^\s*/)[0], val = km[3].slice(lead.length);
        out += lead + hlValue(val);
        if (/^[|>][-+]?\d*\s*(#.*)?$/.test(val.trim())) blockCol = ind;
      }
    } else out += hlValue(rest);
    return out;
  }).join("\n");
}
function hlSh(code){
  return code.split("\n").map(line => {
    const m = line.match(/^(\s*)(#.*)$/);
    if (m) return esc(m[1]) + `<span class="tc">${esc(m[2])}</span>`;
    const ci = line.search(/\s#\s/);
    const body = ci >= 0 ? line.slice(0, ci) : line, c = ci >= 0 ? line.slice(ci) : "";
    return esc(body).replace(/^(\s*)(git|gh)\b/, '$1<span class="tk">$2</span>').replace(/(\s)(--?[\w-]+)/g, '$1<span class="tt">$2</span>')
      + (c ? `<span class="tc">${esc(c)}</span>` : "");
  }).join("\n");
}
function hlText(code){
  // highlight AB#123, #123, @mentions and trailing comments in plain text blocks
  return code.split("\n").map(line => {
    const ci = line.search(/\s{2,}(?=\S)/);
    const body = ci >= 0 ? line.slice(0, ci) : line, rest = ci >= 0 ? line.slice(ci) : "";
    const h = s => esc(s).replace(/(AB#\d+|(?:^|(?<=\s))[!#]\d+|@[\w-]+(?:\/[\w-]+)?)/g, '<span class="td">$1</span>');
    return h(body) + (rest ? `<span class="tc">${esc(rest)}</span>` : "");
  }).join("\n");
}
const HL = {
  bicep:{c:/\/\/.*/y, kw:/^(param|var|resource|module|output|targetScope|using|existing|if|for|in|true|false|null|import|type|metadata)$/},
  hcl:{c:/#.*/y, kw:/^(terraform|backend|provider|resource|data|variable|output|locals|module|true|false)$/},
  ps:{c:/#.*/y, kw:/^(configuration|node|import-dscresource|windowsfeature|service|param)$/i, flags:true},
  sh:{c:/#.*/y, kw:/^(az|terraform|bicep|new-azresourcegroupdeployment|test-aztemplate)$/i, flags:true},
  json:{c:null, kw:/^(true|false|null)$/}
};
function hlCode(code, lang){
  const L = HL[lang] || HL.sh;
  const span = (c, s) => `<span class="${c}">${esc(s)}</span>`;
  return code.split("\n").map(line => {
    let out = "", i = 0;
    while (i < line.length){
      const ch = line[i], prev = i ? line[i - 1] : " ";
      if (L.c && (lang === "bicep" || /\s/.test(prev))){
        L.c.lastIndex = i; const m = L.c.exec(line);
        if (m){ out += span("tc", m[0]); break; }
      }
      if (ch === "'" || ch === '"'){
        let j = i + 1; while (j < line.length && line[j] !== ch){ if (line[j] === "\\" && lang !== "ps") j++; j++; }
        const s = line.slice(i, j + 1);
        out += span(lang === "json" && /^\s*:/.test(line.slice(j + 1)) ? "tk" : "ts", s); i = j + 1; continue;
      }
      const w = /[\s(\[{,=:]/.test(prev) || i === 0 ? line.slice(i).match(/^(-{0,2}[A-Za-z_@$][\w.@$-]*|\d+(\.\d+)*\b)/) : null;
      if (w){
        const t = w[0];
        out += L.kw.test(t) ? span("tk", t) : (L.flags && /^-/.test(t)) ? span("tt", t) : /^\d/.test(t) ? span("tn", t) : /^@/.test(t) ? span("td", t) : esc(t);
        i += t.length; continue;
      }
      out += esc(ch); i++;
    }
    return out;
  }).join("\n");
}
function highlight(code, lang){
  if (lang === "text") return hlText(code);
  if (!lang || lang === "yaml") return hlYaml(code);
  return hlCode(code, lang);
}
function codeBlock(code, lang){
  return `<div class="codewrap"><pre><code>${highlight(code, lang || "yaml")}</code></pre><button class="copy">Copy</button></div>`;
}

/* ===================================================================
   UI
   =================================================================== */
const KIND = {mc:"Single choice", multi:"Select all that apply", order:"Put in order", match:"Match", fill:"Fill in the blanks", lines:"Spot the error", text:"Write it"};

function startApp(){
  const store = {
    get(k, d){ try { const v = localStorage.getItem("iacLab:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem("iacLab:" + k, JSON.stringify(v)); } catch {} }
  };
  let done = store.get("done", []).filter(id => ALL_EX.some(e => e.id === id));
  let current = Math.min(store.get("current", 0), MODULES.length - 1);
  const $ = s => document.querySelector(s);
  const state = {};   // exercise id → current answer
  const modDone = m => m.exercises.filter(e => done.includes(e.id)).length;

  function renderNav(){
    let html = "", lastGroup = "";
    MODULES.forEach((m, i) => {
      if (m.group !== lastGroup){ html += `<div class="group">${m.group}</div>`; lastGroup = m.group; }
      const n = modDone(m), all = n === m.exercises.length;
      const cls = [i === current ? "active" : "", all ? "done" : ""].join(" ");
      html += `<button class="${cls}" data-i="${i}"><span class="num">${all ? "✓" : i + 1}</span>${m.title}<span class="cnt">${n}/${m.exercises.length}</span></button>`;
    });
    $("#nav").innerHTML = html;
    $("#bar").style.width = (done.length / ALL_EX.length * 100) + "%";
    $("#ptext").textContent = `${done.length} of ${ALL_EX.length} exercises completed`;
  }

  /* ---------- per-type input rendering ---------- */
  function bodyHtml(ex){
    const sid = ex.id;
    switch (ex.type){
      case "mc": case "multi":
        return `<div class="opts">${ex.options.map((o, i) =>
          `<label class="opt" data-i="${i}"><input type="${ex.type === "mc" ? "radio" : "checkbox"}" name="${sid}" value="${i}"><span>${o}</span></label>`).join("")}</div>`;
      case "order":
        return `<ol class="order" id="ol-${sid}"></ol>`;
      case "match":
        return `<table class="match">${ex.rows.map((r, i) =>
          `<tr data-i="${i}"><td>${r[0]}</td><td><select aria-label="Answer ${i + 1}"><option value="">— choose —</option>${ex.choices.map(c => `<option>${esc(c)}</option>`).join("")}</select></td></tr>`).join("")}</table>`;
      case "fill": {
        let k = 0;
        const html = ex.tpl.replace(/\[\[(\d+)\]\]/g, (_, n) => {
          const w = Math.max(6, ...ex.blanks[+n].map(b => b.length)) + 2;
          k++; return `<input data-b="${n}" size="${w}" aria-label="Blank ${+n + 1}" autocomplete="off" spellcheck="false">`;
        });
        return `<div class="fill${ex.mono ? " mono" : ""}">${html}</div>`;
      }
      case "lines":
        return `<div class="lines${ex.prose ? " prose" : ""}">${ex.code.map((l, i) =>
          `<div class="ln" data-i="${i}" role="button" tabindex="0"><span class="no">${i + 1}</span><span>${esc(l) || " "}</span></div>`).join("")}</div>`;
      case "text":
        return `<textarea class="${ex.lang === "sh" ? "short" : ""}" spellcheck="false" aria-label="Answer editor"></textarea>
          <p class="edhelp">Tab / Shift+Tab indent by 2 spaces · Enter keeps the indentation · Ctrl+Enter checks your answer · your draft is saved automatically</p>`;
    }
  }

  function solutionHtml(ex){
    switch (ex.type){
      case "mc": return `<p><b>Answer:</b> ${ex.options[ex.answer]}</p>`;
      case "multi": return `<ul class="tips">${ex.answer.map(i => `<li>${ex.options[i]}</li>`).join("")}</ul>`;
      case "order": return `<ol class="tips">${ex.items.map(t => `<li>${t}</li>`).join("")}</ol>`;
      case "match": return `<div class="tablewrap"><table class="ref">${ex.rows.map(r => `<tr><td>${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join("")}</table></div>`;
      case "fill": {
        const html = ex.tpl.replace(/\[\[(\d+)\]\]/g, (_, n) => `<b><u>${esc(ex.blanks[+n][0])}</u></b>`);
        return `<div class="fill${ex.mono ? " mono" : ""}">${html}</div>`;
      }
      case "lines": return `<p>Faulty line${ex.answer.length > 1 ? "s" : ""}: ${ex.answer.map(i => `<b>${i + 1}</b>`).join(", ")}</p>`;
      case "text": return codeBlock(ex.solution, ex.lang);
    }
  }

  function wireExercise(ex, root){
    const id = ex.id;
    const q = s => root.querySelector(s);
    const draftKey = "draft:" + id;

    if (ex.type === "mc"){
      root.querySelectorAll("input").forEach(inp => inp.onchange = () => { state[id] = +inp.value; clearMarks(); });
      state[id] = null;
    }
    if (ex.type === "multi"){
      state[id] = [];
      root.querySelectorAll("input").forEach(inp => inp.onchange = () => {
        state[id] = [...root.querySelectorAll("input:checked")].map(x => +x.value); clearMarks();
      });
    }
    if (ex.type === "order"){
      state[id] = scramble(id, ex.items.length);
      const ol = q(".order");
      let dragFrom = null;
      const draw = (marks) => {
        ol.innerHTML = state[id].map((it, pos) =>
          `<li draggable="true" data-pos="${pos}" class="${marks ? (marks[pos] ? "right" : "wrong") : ""}"><span class="pos">${pos + 1}</span><span class="txt">${ex.items[it]}</span>
            <span class="mv"><button class="btn small" data-mv="-1" ${pos === 0 ? "disabled" : ""} aria-label="Move up">↑</button><button class="btn small" data-mv="1" ${pos === ex.items.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button></span></li>`).join("");
      };
      const move = (from, to) => {
        const a = state[id]; const [x] = a.splice(from, 1); a.splice(to, 0, x); draw();
      };
      ol.onclick = e => {
        const b = e.target.closest("button[data-mv]"); if (!b) return;
        const pos = +b.closest("li").dataset.pos, to = pos + +b.dataset.mv;
        if (to >= 0 && to < ex.items.length) move(pos, to);
      };
      ol.addEventListener("dragstart", e => { const li = e.target.closest("li"); if (li){ dragFrom = +li.dataset.pos; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", ""); } catch {} } });
      ol.addEventListener("dragover", e => { if (dragFrom !== null) e.preventDefault(); });
      ol.addEventListener("drop", e => { e.preventDefault(); const li = e.target.closest("li"); if (li && dragFrom !== null) move(dragFrom, +li.dataset.pos); dragFrom = null; });
      ol.addEventListener("dragend", () => { dragFrom = null; });
      root._draw = draw;
      draw();
    }
    if (ex.type === "match"){
      state[id] = ex.rows.map(() => "");
      root.querySelectorAll("select").forEach((s, i) => s.onchange = () => { state[id][i] = s.value; s.closest("tr").className = ""; });
    }
    if (ex.type === "fill"){
      state[id] = ex.blanks.map(() => "");
      root.querySelectorAll(".fill input").forEach(inp => {
        inp.oninput = () => { state[id][+inp.dataset.b] = inp.value; inp.className = ""; };
        inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); check(); } };
      });
    }
    if (ex.type === "lines"){
      state[id] = [];
      const toggle = el => {
        const i = +el.dataset.i, a = state[id];
        if (a.includes(i)) a.splice(a.indexOf(i), 1); else a.push(i);
        root.querySelectorAll(".ln").forEach(l => l.className = "ln" + (a.includes(+l.dataset.i) ? " sel" : ""));
      };
      root.querySelectorAll(".ln").forEach(el => {
        el.onclick = () => toggle(el);
        el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(el); } };
      });
    }
    if (ex.type === "text"){
      const ed = q("textarea");
      const saved = store.get(draftKey, null);
      ed.value = saved !== null ? saved : ex.starter;
      state[id] = ed.value;
      const save = () => { state[id] = ed.value; store.set(draftKey, ed.value); };
      const insert = t => {
        ed.focus();
        if (!document.execCommand || !document.execCommand("insertText", false, t)){
          const s = ed.selectionStart, en = ed.selectionEnd;
          ed.value = ed.value.slice(0, s) + t + ed.value.slice(en);
          ed.selectionStart = ed.selectionEnd = s + t.length;
          save();
        }
      };
      ed.addEventListener("input", save);
      ed.addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); check(); return; }
        if (e.key === "Tab" && !e.shiftKey){ e.preventDefault(); insert("  "); return; }
        if (e.key === "Tab" && e.shiftKey){
          e.preventDefault();
          const s = ed.selectionStart, ls = ed.value.lastIndexOf("\n", s - 1) + 1;
          const n = ed.value.slice(ls, ls + 2).match(/^ {0,2}/)[0].length;
          if (n){ ed.value = ed.value.slice(0, ls) + ed.value.slice(ls + n); ed.selectionStart = ed.selectionEnd = Math.max(ls, s - n); save(); }
          return;
        }
        if (e.key === "Enter" && !e.shiftKey && !e.altKey){
          const before = ed.value.slice(0, ed.selectionStart);
          const line = before.slice(before.lastIndexOf("\n") + 1);
          let ind = line.match(/^ */)[0].length;
          const dm = line.slice(ind).match(/^(-\s+)+/);
          if (ex.lang === "yaml"){
            if (dm && /:/.test(line)) ind += dm[0].length;
            if (!/^\s*#/.test(line) && /(:|:\s*[|>][-+]?)\s*$/.test(line)) ind += 2;
          } else if (/[{(\[]\s*$/.test(line)) ind += 2;
          e.preventDefault();
          insert("\n" + " ".repeat(ind));
        }
      });
    }

    function clearMarks(){
      root.querySelectorAll(".opt").forEach(o => o.classList.remove("right", "wrong"));
    }

    function check(){
      const g = grade(ex, state[id]);
      // per-item coloring
      if (ex.type === "mc" || ex.type === "multi"){
        clearMarks();
        const sel = ex.type === "mc" ? (state[id] === null ? [] : [state[id]]) : state[id];
        sel.forEach(i => root.querySelector(`.opt[data-i="${i}"]`).classList.add(
          (ex.type === "mc" ? i === ex.answer : ex.answer.includes(i)) ? "right" : "wrong"));
      }
      if (ex.type === "order") root._draw(g.marks);
      if (ex.type === "match") root.querySelectorAll(".match tr").forEach((tr, i) => tr.className = g.marks[i] ? "right" : "wrong");
      if (ex.type === "fill") root.querySelectorAll(".fill input").forEach(inp => inp.className = g.marks[+inp.dataset.b] ? "right" : "wrong");
      if (ex.type === "lines") root.querySelectorAll(".ln").forEach(l => {
        const i = +l.dataset.i, sel = state[id].includes(i);
        l.className = "ln" + (sel ? (ex.answer.includes(i) ? " right" : " wrong") : "");
      });
      q(".results").innerHTML = g.results.map(r =>
        `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "✔" : "✘"} ${esc(r.l)}${(r.sub || []).map(s => `<span class="sub">↳ ${esc(s)}</span>`).join("")}</li>`).join("") +
        (ex.type === "text" ? `<li class="${g.ok ? "pass" : "fail"}"><b>${g.results.filter(r => r.ok).length}/${g.results.length} checks passed${g.ok ? ". Nice work! 🎉" : ""}</b></li>` : "");
      if (g.ok){
        q(".why").style.display = "block";
        if (!done.includes(id)){ done.push(id); store.set("done", done); renderNav(); }
        root.classList.add("solved");
      }
    }

    q(".checkBtn").onclick = check;
    q(".hintBtn").onclick = () => { const h = q(".hint"); h.style.display = h.style.display === "block" ? "none" : "block"; };
    q(".solBtn").onclick = e => {
      const s = q(".solution"), show = s.style.display !== "block";
      s.style.display = show ? "block" : "none";
      q(".why").style.display = show || root.classList.contains("solved") ? "block" : "none";
      e.target.textContent = show ? "Hide solution" : "Show solution";
    };
    q(".resetBtn").onclick = () => {
      if (ex.type === "text") store.set(draftKey, null);
      const fresh = document.createElement("section");
      root.replaceWith(fresh);
      buildExercise(ex, fresh);
    };
  }

  function buildExercise(ex, el){
    const n = ALL_EX.indexOf(ex) + 1;
    el.className = "exercise" + (done.includes(ex.id) ? " solved" : "");
    el.id = "ex-" + ex.id;
    el.innerHTML = `
      <h3>🧪 ${n}. ${ex.title} <span class="kind">${KIND[ex.type]}</span> <span class="badge">Completed</span></h3>
      <div>${ex.q}</div>
      ${bodyHtml(ex)}
      <div class="btns">
        <button class="btn primary checkBtn">Check my answer</button>
        <button class="btn hintBtn">Hint</button>
        <button class="btn solBtn">Show solution</button>
        <button class="btn resetBtn">Reset</button>
      </div>
      <div class="hint">💡 ${ex.hint}</div>
      <ul class="results"></ul>
      <div class="solution"><p class="solhead">Model answer</p>${solutionHtml(ex)}</div>
      <div class="why"><b>Why:</b> ${ex.why}</div>`;
    wireExercise(ex, el);
  }

  function renderModule(){
    const m = MODULES[current];
    const sections = m.sections.map(s => `
        <h3>${s.h}</h3>
        ${s.p ? `<p>${s.p}</p>` : ""}
        ${s.file ? `<div class="file">${s.file}</div>` : ""}
        ${s.code ? codeBlock(s.code, s.lang) : ""}
        ${s.after || ""}`).join("");

    $("#content").innerHTML = `
      <span class="tag">Module ${current + 1} of ${MODULES.length} · ${m.tag}</span>
      <h2>${m.title}</h2>
      <p class="lead">${m.intro}</p>
      ${sections}
      ${m.tip ? `<div class="note exam">🎯 <b>AZ-400 exam tip:</b> ${m.tip}</div>` : ""}
      <h3 style="margin-top:36px">Exercises (${m.exercises.length})</h3>
      <div id="exlist"></div>
      <div class="navfoot">
        <button class="btn" id="prevBtn" ${current === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn" id="nextBtn" ${current === MODULES.length - 1 ? "disabled" : ""}>Next →</button>
      </div>`;
    const list = $("#exlist");
    m.exercises.forEach(ex => { const el = document.createElement("section"); list.appendChild(el); buildExercise(ex, el); });
    $("#prevBtn").onclick = () => go(current - 1);
    $("#nextBtn").onclick = () => go(current + 1);
    renderNav();
    window.scrollTo(0, 0);
  }

  function go(i){
    if (i < 0 || i >= MODULES.length) return;
    current = i; store.set("current", i);
    $("#side").classList.remove("open");
    renderModule();
  }

  $("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
  $("#menuBtn").onclick = () => $("#side").classList.toggle("open");
  document.addEventListener("click", e => {
    if (!e.target.classList.contains("copy")) return;
    const text = e.target.previousElementSibling.innerText;
    navigator.clipboard?.writeText(text).then(() => { e.target.textContent = "Copied!"; setTimeout(() => e.target.textContent = "Copy", 1200); });
  });
  $("#themeBtn").onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme);
  };
  $("#resetAllBtn").onclick = () => {
    if (!confirm("Reset all progress and saved drafts for this lab?")) return;
    done = []; store.set("done", done);
    ALL_EX.filter(e => e.type === "text").forEach(e => store.set("draft:" + e.id, null));
    renderModule();
  };
  const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t;

  renderModule();
}

if (typeof document !== "undefined" && document.getElementById("content")) startApp();
</script>
</body>
</html>
